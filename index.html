<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Faktury">
<meta name="theme-color" content="#0f172a">
<title>Faktury zakupowe</title>
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #6b7280;
    --accent: #0a84ff;
    --accent-text: #ffffff;
    --border: #e5e5ea;
    --red: #ff3b30;
    --red-bg: #ffe5e3;
    --green: #1a9850;
    --green-bg: #e3f6ea;
    --amber-bg: #fff2d9;
    --shadow: 0 1px 2px rgba(0,0,0,0.06), 0 1px 8px rgba(0,0,0,0.04);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f2f2f7;
      --muted: #9a9aa2;
      --accent: #0a84ff;
      --accent-text: #ffffff;
      --border: #2c2c2e;
      --red: #ff453a;
      --red-bg: #3a1f1d;
      --green: #34c759;
      --green-bg: #16321f;
      --amber-bg: #3a2f14;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { padding-bottom: calc(80px + var(--safe-bottom)); }
  h1, h2 { margin: 0; }
  button { font: inherit; color: inherit; }
  input, select { font: inherit; }

  .topbar { position: sticky; top: 0; z-index: 20; background: var(--bg);
    padding: calc(10px + var(--safe-top)) 16px 8px; border-bottom: 1px solid var(--border); }
  .title-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .title-row h1 { font-size: 20px; font-weight: 700; }
  .generated { font-size: 11px; color: var(--muted); }

  .company-switch { display: flex; background: rgba(120,120,128,0.16); border-radius: 9px; padding: 2px; }
  .company-btn { flex: 1; border: none; background: transparent; padding: 6px 8px; border-radius: 7px;
    font-size: 14px; font-weight: 600; color: var(--text); }
  .company-btn.active { background: var(--card); box-shadow: var(--shadow); }

  .filters { padding: 10px 16px 0; display: flex; flex-direction: column; gap: 8px; }
  #searchInput { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); }
  .filter-row2 { display: flex; gap: 8px; align-items: center; }
  .segmented { display: flex; flex: 1; background: rgba(120,120,128,0.16); border-radius: 9px; padding: 2px; }
  .segmented button { flex: 1; border: none; background: transparent; padding: 6px 4px; border-radius: 7px;
    font-size: 12.5px; font-weight: 600; color: var(--text); }
  .segmented button.active { background: var(--card); box-shadow: var(--shadow); }
  .chip-button { white-space: nowrap; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--card); font-size: 12.5px; font-weight: 600; }
  #sortSelect { border-radius: 9px; border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 7px 8px; font-size: 12.5px; }

  .months { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; }
  .months::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--card); font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; }
  .chip.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  .summary { padding: 0 16px 6px; font-size: 12.5px; color: var(--muted); font-weight: 600; }

  .list { padding: 4px 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .empty-state { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 14px; }

  .invoice-row { display: flex; align-items: flex-start; gap: 10px; background: var(--card);
    border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); }
  .invoice-row.selected { outline: 2px solid var(--accent); }
  .select-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border);
    background: var(--card); flex: none; margin-top: 2px; padding: 0; }
  .invoice-row.selected .select-dot { background: var(--accent); border-color: var(--accent);
    position: relative; }
  .invoice-row.selected .select-dot::after { content: ""; position: absolute; left: 50%; top: 44%;
    width: 5px; height: 9px; border-right: 2px solid #fff; border-bottom: 2px solid #fff;
    transform: translate(-50%,-50%) rotate(45deg); }

  .row-main { flex: 1; min-width: 0; }
  .row-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .kontrahent { font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .kwota { font-size: 14.5px; font-weight: 700; flex: none; }
  .kwota.negative { color: var(--red); }

  .row-bottom { display: flex; align-items: center; gap: 8px; margin-top: 3px; flex-wrap: wrap; }
  .numer { font-size: 12.5px; color: var(--muted); }
  .termin { font-size: 12.5px; color: var(--muted); }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; margin-left: auto; }
  .badge.paid { background: var(--green-bg); color: var(--green); }
  .badge.unpaid { background: var(--amber-bg); color: #9a6a00; }
  .badge.overdue { background: var(--red-bg); color: var(--red); }

  .row-details { margin-top: 6px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border);
    padding-top: 6px; line-height: 1.5; }
  .row-details[hidden] { display: none; }

  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35); opacity: 0; pointer-events: none;
    transition: opacity .2s; z-index: 30; }
  .sheet-backdrop.visible { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 16px 16px 0 0;
    padding: 8px 16px calc(16px + var(--safe-bottom)); max-height: 78vh; display: flex; flex-direction: column;
    transform: translateY(105%); transition: transform .25s; z-index: 31; box-shadow: 0 -4px 24px rgba(0,0,0,0.2); }
  .sheet.visible { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 5px; border-radius: 3px; background: var(--border); margin: 4px auto 10px; }
  .sheet h2 { font-size: 17px; margin-bottom: 10px; }
  #contractorSearch { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); margin-bottom: 8px; }
  .sheet-actions-top { display: flex; gap: 8px; margin-bottom: 8px; }
  .sheet-actions-top button { flex: 1; padding: 7px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--card); font-size: 12.5px; font-weight: 600; }
  .contractor-list { overflow-y: auto; flex: 1; border-top: 1px solid var(--border); }
  .contractor-item { display: flex; align-items: center; gap: 10px; padding: 10px 2px;
    border-bottom: 1px solid var(--border); font-size: 14px; }
  .contractor-item input { width: 18px; height: 18px; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 12px; }
  .sheet-actions button { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; }
  .sheet-actions .secondary { background: rgba(120,120,128,0.16); color: var(--text); }
  .sheet-actions .primary { background: var(--accent); color: var(--accent-text); }

  .selection-bar { position: fixed; left: 12px; right: 12px; bottom: calc(12px + var(--safe-bottom));
    background: var(--card); border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.18);
    padding: 10px 12px; display: flex; align-items: center; gap: 10px; transform: translateY(140%);
    transition: transform .2s; z-index: 25; }
  .selection-bar.visible { transform: translateY(0); }
  .selection-info { flex: 1; font-size: 12.5px; font-weight: 700; color: var(--green); }
  .selection-actions { display: flex; gap: 6px; }
  .selection-actions button { padding: 8px 12px; border-radius: 10px; border: none; font-size: 12.5px; font-weight: 700; }
  #copyNumbersBtn { background: var(--accent); color: var(--accent-text); }
  #clearSelectionBtn { background: rgba(120,120,128,0.16); color: var(--text); }

  .toast { position: fixed; left: 50%; bottom: calc(100px + var(--safe-bottom)); transform: translate(-50%, 8px);
    background: rgba(28,28,30,0.92); color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 40; }
  .toast.visible { opacity: 1; transform: translate(-50%, 0); }

  #app { display: none; }
  #pinGate { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex;
    align-items: center; justify-content: center; padding: 24px; }
  #pinGate .card { background: var(--card); border-radius: 16px; padding: 28px 24px; width: 100%;
    max-width: 320px; box-shadow: var(--shadow); text-align: center; }
  #pinGate h2 { font-size: 17px; margin-bottom: 6px; }
  #pinGate p { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  #pinGate input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 22px; text-align: center; letter-spacing: 6px;
    margin-bottom: 12px; }
  #pinGate button { width: 100%; padding: 13px; border-radius: 12px; border: none; background: var(--accent);
    color: var(--accent-text); font-size: 15px; font-weight: 600; }
  #pinGate .err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 10px; }
</style>
</head>
<body>
<div id="pinGate">
  <div class="card">
    <h2>Faktury — dostęp</h2>
    <p>Wpisz kod, żeby zobaczyć dane</p>
    <input id="pinInput" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" autofocus>
    <button id="pinSubmit">Odblokuj</button>
    <div class="err" id="pinErr"></div>
  </div>
</div>
<div id="app">
  <header class="topbar">
    <div class="title-row">
      <h1>Faktury zakupowe</h1>
      <span class="generated" id="generatedAt"></span>
    </div>
    <div class="company-switch" id="companySwitch"></div>
  </header>

  <div class="filters">
    <input id="searchInput" type="search" placeholder="Szukaj: kontrahent, numer, NIP..." autocapitalize="off" autocorrect="off">
    <div class="filter-row2">
      <div class="segmented">
        <button id="paidAll" class="active">Wszystkie</button>
        <button id="paidUnpaid">Nieopłacone</button>
        <button id="paidPaid">Opłacone</button>
      </div>
    </div>
    <div class="filter-row2">
      <button class="chip-button" id="contractorButton">Kontrahent: wszyscy</button>
      <select id="sortSelect">
        <option value="date_desc">Najnowsze najpierw</option>
        <option value="date_asc">Najstarsze najpierw</option>
        <option value="amount_desc">Kwota malejąco</option>
        <option value="amount_asc">Kwota rosnąco</option>
        <option value="due_asc">Termin: najbliższy</option>
        <option value="name_asc">Kontrahent A-Z</option>
      </select>
    </div>
  </div>

  <div class="months" id="monthTabs"></div>
  <div class="summary" id="summaryLine"></div>
  <div class="list" id="invoiceList"></div>
</div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="contractorSheet">
  <div class="sheet-handle"></div>
  <h2>Kontrahenci</h2>
  <input id="contractorSearch" type="search" placeholder="Szukaj kontrahenta...">
  <div class="sheet-actions-top">
    <button id="selectAllContractors">Zaznacz wszystkich</button>
    <button id="clearAllContractors">Odznacz wszystkich</button>
  </div>
  <div class="contractor-list" id="contractorList"></div>
  <div class="sheet-actions">
    <button id="cancelContractors" class="secondary">Anuluj</button>
    <button id="applyContractors" class="primary">Zastosuj</button>
  </div>
</div>

<div class="selection-bar" id="selectionBar">
  <div class="selection-info" id="selectionInfo"></div>
  <div class="selection-actions">
    <button id="copyNumbersBtn">Kopiuj numery</button>
    <button id="clearSelectionBtn">Wyczyść</button>
  </div>
</div>

<div class="toast" id="toast"></div>

  var companyKeys = Object.keys(DATA.companies);
  var state = {
    company: companyKeys[0] || "victoria",
    search: "",
    paid: "Wszystkie",
    contractors: null,
    month: "__all__",
    selected: new Set()
  };
  var contractorDraft = null;

  function el(id) { return document.getElementById(id); }

  function currentRows() {
    var c = DATA.companies[state.company];
    return (c && c.rows) || [];
  }

  function rowKey(row) { return row.numer + "||" + row.nip; }

  function monthOf(dateStr) {
    var m = /^(\d{4})-(\d{2})/.exec(dateStr || "");
    return m ? (m[1] + "-" + m[2]) : "Bez terminu";
  }

  function contractorsForCurrentCompany() {
    var set = new Set();
    currentRows().forEach(function (r) { if (r.kontrahent) set.add(r.kontrahent); });
    return Array.from(set).sort(function (a, b) { return a.localeCompare(b, "pl"); });
  }

  function monthsForCurrentCompany() {
    var set = new Set();
    currentRows().forEach(function (r) { set.add(monthOf(r.wystawienia)); });
    var nums = Array.from(set).filter(function (m) { return m !== "Bez terminu"; }).sort().reverse();
    var rest = set.has("Bez terminu") ? ["Bez terminu"] : [];
    return ["__all__"].concat(nums, rest);
  }

  function filteredRows() {
    var q = state.search.trim().toLowerCase();
    return currentRows().filter(function (r) {
      if (state.paid !== "Wszystkie") {
        var isPaid = r.zaplacone ? "Tak" : "Nie";
        if (isPaid !== state.paid) return false;
      }
      if (state.contractors && !state.contractors.has(r.kontrahent)) return false;
      if (state.month !== "__all__" && monthOf(r.wystawienia) !== state.month) return false;
      if (q) {
        var hay = (r.kontrahent + " " + r.nip + " " + r.numer).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function sortRows(rows) {
    var mode = el("sortSelect").value;
    var arr = rows.slice();
    function s(a) { return a || ""; }
    if (mode === "date_desc") arr.sort(function (a, b) { return s(b.wystawienia).localeCompare(s(a.wystawienia)); });
    else if (mode === "date_asc") arr.sort(function (a, b) { return s(a.wystawienia).localeCompare(s(b.wystawienia)); });
    else if (mode === "amount_desc") arr.sort(function (a, b) { return (Number(b.kwota) || 0) - (Number(a.kwota) || 0); });
    else if (mode === "amount_asc") arr.sort(function (a, b) { return (Number(a.kwota) || 0) - (Number(b.kwota) || 0); });
    else if (mode === "due_asc") arr.sort(function (a, b) { return s(a.termin).localeCompare(s(b.termin)); });
    else if (mode === "name_asc") arr.sort(function (a, b) { return s(a.kontrahent).localeCompare(s(b.kontrahent), "pl"); });
    return arr;
  }

  function formatAmount(n) {
    var num = Number(n) || 0;
    var negative = num < 0;
    var abs = Math.abs(num).toFixed(2);
    var parts = abs.split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return (negative ? "-" : "") + parts[0] + "," + parts[1];
  }

  function polishWord(n) {
    if (n === 1) return "fakturę";
    var last2 = n % 100, last = n % 10;
    if (last >= 2 && last <= 4 && !(last2 >= 12 && last2 <= 14)) return "faktury";
    return "faktur";
  }

  function allRowsForCompanyByKey() {
    var map = new Map();
    currentRows().forEach(function (r) { map.set(rowKey(r), r); });
    return map;
  }

  function setCompany(company) {
    if (state.company === company) return;
    state.company = company;
    state.search = ""; el("searchInput").value = "";
    state.paid = "Wszystkie"; setPaidButtons("Wszystkie");
    state.contractors = null;
    state.month = "__all__";
    state.selected.clear();
    render();
  }

  function setPaidButtons(value) {
    el("paidAll").classList.toggle("active", value === "Wszystkie");
    el("paidUnpaid").classList.toggle("active", value === "Nie");
    el("paidPaid").classList.toggle("active", value === "Tak");
  }

  function toggleSelect(row) {
    var key = rowKey(row);
    if (state.selected.has(key)) state.selected.delete(key); else state.selected.add(key);
    renderList(sortRows(filteredRows()));
    renderSelectionBar();
  }

  function showToast(msg) {
    var t = el("toast");
    t.textContent = msg;
    t.classList.add("visible");
    setTimeout(function () { t.classList.remove("visible"); }, 1800);
  }

  function copySelectedNumbers() {
    var map = allRowsForCompanyByKey();
    var rows = Array.from(state.selected).map(function (k) { return map.get(k); }).filter(Boolean);
    var text = rows.map(function (r) { return r.numer; }).filter(Boolean).join("\n");
    if (!text) return;
    function done() { showToast("Skopiowano " + rows.length + " " + polishWord(rows.length)); }
    function fallback() {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) { done(); return; }
      } catch (e) { /* ignore, fall through */ }
      window.prompt("Zaznacz i skopiuj (Cmd+C):", text);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  function renderCompanySwitch() {
    var box = el("companySwitch");
    box.textContent = "";
    companyKeys.forEach(function (key) {
      var btn = document.createElement("button");
      btn.className = "company-btn" + (state.company === key ? " active" : "");
      btn.textContent = DATA.companies[key].label;
      btn.addEventListener("click", function () { setCompany(key); });
      box.appendChild(btn);
    });
  }

  function renderMonthTabs() {
    var box = el("monthTabs");
    box.textContent = "";
    monthsForCurrentCompany().forEach(function (m) {
      var btn = document.createElement("button");
      btn.className = "chip" + (state.month === m ? " active" : "");
      btn.textContent = m === "__all__" ? "Wszystkie miesiące" : m;
      btn.addEventListener("click", function () { state.month = m; render(); });
      box.appendChild(btn);
    });
  }

  function renderContractorButton() {
    var all = contractorsForCurrentCompany();
    var btn = el("contractorButton");
    if (!state.contractors) {
      btn.textContent = "Kontrahent: wszyscy (" + all.length + ")";
    } else {
      btn.textContent = "Kontrahent: " + state.contractors.size + " z " + all.length;
    }
  }

  function renderSummary(rows) {
    var unpaid = rows.filter(function (r) { return !r.zaplacone; });
    var total = unpaid.reduce(function (s, r) { return s + (Number(r.kwota) || 0); }, 0);
    el("summaryLine").textContent = "Widocznych: " + rows.length + " · nieopłaconych: " + unpaid.length +
      " na kwotę " + formatAmount(total) + " zł";
  }

  function renderList(rows) {
    var box = el("invoiceList");
    box.textContent = "";
    if (!rows.length) {
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "Brak faktur spełniających kryteria.";
      box.appendChild(empty);
      return;
    }
    var today = new Date().toISOString().slice(0, 10);
    rows.forEach(function (r) {
      var key = rowKey(r);
      var row = document.createElement("div");
      row.className = "invoice-row" + (state.selected.has(key) ? " selected" : "");

      var dot = document.createElement("button");
      dot.className = "select-dot";
      dot.setAttribute("aria-label", "Zaznacz fakturę");
      dot.addEventListener("click", function (e) { if (e && e.stopPropagation) e.stopPropagation(); toggleSelect(r); });
      row.appendChild(dot);

      var main = document.createElement("div");
      main.className = "row-main";

      var top = document.createElement("div");
      top.className = "row-top";
      var nameEl = document.createElement("span");
      nameEl.className = "kontrahent";
      nameEl.textContent = r.kontrahent || "(brak nazwy)";
      var amountEl = document.createElement("span");
      amountEl.className = "kwota" + (Number(r.kwota) < 0 ? " negative" : "");
      amountEl.textContent = formatAmount(r.kwota) + " zł";
      top.appendChild(nameEl); top.appendChild(amountEl);

      var bottom = document.createElement("div");
      bottom.className = "row-bottom";
      var numEl = document.createElement("span");
      numEl.className = "numer";
      numEl.textContent = r.numer || "—";
      var terminEl = document.createElement("span");
      terminEl.className = "termin";
      terminEl.textContent = r.termin ? ("termin " + r.termin) : "";
      var overdue = !r.zaplacone && r.termin && r.termin < today;
      var badge = document.createElement("span");
      badge.className = "badge " + (r.zaplacone ? "paid" : (overdue ? "overdue" : "unpaid"));
      badge.textContent = r.zaplacone ? "Opłacona" : (overdue ? "Po terminie" : "Nieopłacona");
      bottom.appendChild(numEl); bottom.appendChild(terminEl); bottom.appendChild(badge);

      var details = document.createElement("div");
      details.className = "row-details";
      details.hidden = true;
      details.textContent = "NIP: " + (r.nip || "—") + " · Rachunek: " + (r.rachunek || "—") +
        " · Wystawiono: " + (r.wystawienia || "—") + " · Źródło: " + (r.zrodlo || "—");

      main.appendChild(top); main.appendChild(bottom); main.appendChild(details);
      main.addEventListener("click", function () { details.hidden = !details.hidden; });

      row.appendChild(main);
      box.appendChild(row);
    });
  }

  function renderSelectionBar() {
    var map = allRowsForCompanyByKey();
    var rows = Array.from(state.selected).map(function (k) { return map.get(k); }).filter(Boolean);
    var bar = el("selectionBar");
    if (!rows.length) { bar.classList.remove("visible"); return; }
    var total = rows.reduce(function (s, r) { return s + (Number(r.kwota) || 0); }, 0);
    el("selectionInfo").textContent = "Zaznaczono " + rows.length + " " + polishWord(rows.length) +
      " — suma " + formatAmount(total) + " zł";
    bar.classList.add("visible");
  }

  function render() {
    renderCompanySwitch();
    renderMonthTabs();
    renderContractorButton();
    var rows = sortRows(filteredRows());
    renderList(rows);
    renderSummary(rows);
    renderSelectionBar();
  }

  function renderContractorList(query) {
    var all = contractorsForCurrentCompany();
    var q = (query || "").trim().toLowerCase();
    var box = el("contractorList");
    box.textContent = "";
    all.filter(function (name) { return !q || name.toLowerCase().indexOf(q) !== -1; }).forEach(function (name) {
      var row = document.createElement("label");
      row.className = "contractor-item";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = contractorDraft.has(name);
      cb.addEventListener("change", function () {
        if (cb.checked) contractorDraft.add(name); else contractorDraft.delete(name);
      });
      var span = document.createElement("span");
      span.textContent = name;
      row.appendChild(cb); row.appendChild(span);
      box.appendChild(row);
    });
  }

  function openContractorSheet() {
    var all = contractorsForCurrentCompany();
    contractorDraft = new Set(state.contractors ? state.contractors : all);
    el("contractorSearch").value = "";
    renderContractorList("");
    el("sheetBackdrop").classList.add("visible");
    el("contractorSheet").classList.add("visible");
  }

  function closeContractorSheet() {
    el("sheetBackdrop").classList.remove("visible");
    el("contractorSheet").classList.remove("visible");
  }

  function init() {
    el("generatedAt").textContent = "Dane z: " + DATA.generated_at;

    el("searchInput").addEventListener("input", debounce(function () {
      state.search = el("searchInput").value;
      render();
    }, 120));

    el("paidAll").addEventListener("click", function () { state.paid = "Wszystkie"; setPaidButtons("Wszystkie"); render(); });
    el("paidUnpaid").addEventListener("click", function () { state.paid = "Nie"; setPaidButtons("Nie"); render(); });
    el("paidPaid").addEventListener("click", function () { state.paid = "Tak"; setPaidButtons("Tak"); render(); });

    el("sortSelect").addEventListener("change", render);

    el("contractorButton").addEventListener("click", openContractorSheet);
    el("sheetBackdrop").addEventListener("click", closeContractorSheet);
    el("cancelContractors").addEventListener("click", closeContractorSheet);
    el("contractorSearch").addEventListener("input", function () { renderContractorList(el("contractorSearch").value); });
    el("selectAllContractors").addEventListener("click", function () {
      contractorsForCurrentCompany().forEach(function (n) { contractorDraft.add(n); });
      renderContractorList(el("contractorSearch").value);
    });
    el("clearAllContractors").addEventListener("click", function () {
      contractorDraft.clear();
      renderContractorList(el("contractorSearch").value);
    });
    el("applyContractors").addEventListener("click", function () {
      var all = contractorsForCurrentCompany();
      state.contractors = (contractorDraft.size === all.length) ? null : new Set(contractorDraft);
      closeContractorSheet();
      render();
    });

    el("copyNumbersBtn").addEventListener("click", copySelectedNumbers);
    el("clearSelectionBtn").addEventListener("click", function () { state.selected.clear(); render(); });

    render();
  }

  function debounce(fn, wait) {
    var t = null;
    return function () {
      var args = arguments;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(null, args); }, wait);
    };
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  window.__mobileApp = { state: state, render: render, filteredRows: filteredRows, sortRows: sortRows,
    formatAmount: formatAmount, polishWord: polishWord, monthOf: monthOf, rowKey: rowKey,
    contractorsForCurrentCompany: contractorsForCurrentCompany, monthsForCurrentCompany: monthsForCurrentCompany,
    toggleSelect: toggleSelect, setCompany: setCompany, openContractorSheet: openContractorSheet,
    closeContractorSheet: closeContractorSheet, copySelectedNumbers: copySelectedNumbers };
})();
</script>
<script>
(function () {
  var HASH = "5119dc8e6294671efc4e76490eec0072786f229a9d76840b2c3707556ebc6c97";
  var STORAGE_KEY = "faktury_unlocked_v1";

  function unlock() {
    document.getElementById("pinGate").style.display = "none";
    document.getElementById("app").style.display = "block";
  }

  async function sha256Hex(text) {
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }

  if (localStorage.getItem(STORAGE_KEY) === "1") {
    unlock();
    return;
  }

  var input = document.getElementById("pinInput");
  var err = document.getElementById("pinErr");

  async function tryUnlock() {
    var value = (input.value || "").trim();
    if (!value) return;
    var hash = await sha256Hex(value);
    if (hash === HASH) {
      localStorage.setItem(STORAGE_KEY, "1");
      unlock();
    } else {
      err.textContent = "Błędny kod";
      input.value = "";
      input.focus();
    }
  }

  document.getElementById("pinSubmit").addEventListener("click", tryUnlock);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });
})();
</script>
